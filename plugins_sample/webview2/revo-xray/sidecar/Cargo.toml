[package]
name = "xray-service"
version = "0.9.0"
edition = "2021"
description = "OpenRevo revo-xray companion service (Xray-core process manager + node/subscription API)"

[[bin]]
name = "xray-service"
path = "src/main.rs"

# Standalone on purpose: this crate lives inside the plugin folder, not in the
# host's src-tauri workspace, so `cargo build` here never touches host code.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_Networking_WinInet",
    "Win32_NetworkManagement_IpHelper",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

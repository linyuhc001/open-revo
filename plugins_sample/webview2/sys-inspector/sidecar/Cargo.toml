[package]
name = "sys-service"
version = "1.0.0"
edition = "2021"
description = "OpenRevo sys-inspector companion service (processes / connections / file occupancy / system metrics)"

[[bin]]
name = "sys-service"
path = "src/main.rs"

# Standalone on purpose: this crate lives inside the plugin folder, not in the
# host's src-tauri workspace, so `cargo build` here never touches host code.
[workspace]

[dependencies]
serde_json = "1"
sysinfo = "0.33.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_RestartManager",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

name: Build PBO Sidecar

# Compiles the pbo-tuner companion service into a standalone .exe and publishes
# it as an artifact. The sidecar crate lives inside the plugin folder and has no
# dependency on src-tauri, so this workflow never builds the host.

on:
  workflow_dispatch:
  push:
    # Only source inputs rebuild. The committed pbo-service.exe also lives
    # under sidecar/, and matching it here would make every artifact commit
    # trigger another build.
    paths:
      - 'plugins_sample/webview2/pbo-tuner/sidecar/src/**'
      - 'plugins_sample/webview2/pbo-tuner/sidecar/Cargo.toml'
      - 'plugins_sample/webview2/pbo-tuner/sidecar/Cargo.lock'
      - 'plugins_sample/webview2/pbo-tuner/sidecar/RyzenSMU.bin'
      - '.github/workflows/pbo-sidecar.yml'

permissions:
  contents: read

# A fork often gets several quick pushes in a row; only the newest commit is
# worth building, so let a new run cancel the one still in flight instead of
# queueing two windows-latest jobs back to back.
concurrency:
  group: pbo-sidecar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins_sample/webview2/pbo-tuner/sidecar

      - name: Build sidecar
        working-directory: plugins_sample/webview2/pbo-tuner/sidecar
        run: cargo build --release

      - name: Verify binary
        working-directory: plugins_sample/webview2/pbo-tuner/sidecar
        shell: pwsh
        run: |
          $exe = "target/release/pbo-service.exe"
          if (-not (Test-Path $exe)) { throw "pbo-service.exe missing" }
          $size = (Get-Item $exe).Length
          Write-Host "built $exe ($size bytes)"
          # Guards against a silently empty/stub build before it reaches users.
          if ($size -lt 200KB) { throw "binary too small: $size bytes" }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          foreach ($needle in @("ioctl_send_smu_command", "/api/health")) {
            if ($text.IndexOf($needle) -lt 0) { throw "missing embedded marker: $needle" }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pbo-service
          path: plugins_sample/webview2/pbo-tuner/sidecar/target/release/pbo-service.exe
          if-no-files-found: error
